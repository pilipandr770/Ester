{% extends "base.html" %}
{% block body %}
<h1>Регистрация</h1>
<form class="card" method="post">{{ csrf_input() }}
<label>Email</label><input name="email" type="email" required>
<label>Пароль (от 8 символов)</label><input name="password" type="password" minlength="8" required>
<p class="mute">Нажимая кнопку, вы подтверждаете, что подключаете только свой аккаунт WhatsApp и что сообщения выбранных чатов будут обрабатываться ИИ-сервисами для перевода и саммари.</p>
<label class="row" style="align-items:flex-start"><input type="checkbox" name="agree" value="1" required style="width:auto;margin:5px 0 0">
<span>Принимаю <a href="{{ url_for('legal', doc='terms', lang='ru') }}" target="_blank">условия</a> и <a href="{{ url_for('legal', doc='privacy', lang='ru') }}" target="_blank">политику конфиденциальности</a>
(<a href="{{ url_for('legal', doc='terms', lang='de') }}" target="_blank">Deutsch</a>)</span></label>
<button>Создать аккаунт</button>
</form>
{% endblock %}
