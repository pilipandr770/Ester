name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: esther
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: esther/requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest tests -q
      - name: Миграции совпадают с моделями
        env:
          APP_ENV: development
          SECRET_KEY: ci-secret-key-0123456789
          DATABASE_URL: sqlite:///ci.db
          FLASK_APP: app.py
        run: |
          flask db upgrade
          flask db check
